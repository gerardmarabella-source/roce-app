<script src="/config.js?v=1"></script>
<script>
// Vuelta del inicio de sesión con Google/Apple: Supabase devuelve la sesión en el #hash; se guarda y se limpia antes de que la carta lea el hash.
(function () {
  var h = location.hash || ''; if (h.indexOf('access_token=') === -1) return;
  var p = new URLSearchParams(h.slice(1)), at = p.get('access_token'); if (!at) return;
  try {
    var u = null; try { u = JSON.parse(atob(at.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); } catch (e) {}
    localStorage.setItem('roce_app_session', JSON.stringify({ access_token: at, refresh_token: p.get('refresh_token'), expires_at: Date.now() + (+(p.get('expires_in') || 3600)) * 1000, user: u ? { id: u.sub, email: u.email } : null }));
  } catch (e) {}
  history.replaceState(null, '', location.pathname);
})();
</script>
